<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richiesta CSV</title><style>body{font:17px/1.6 Arial,sans-serif;color:#243b53;background:#f1f4f8;margin:0}main{max-width:1000px;margin:40px auto;padding:44px;background:white;border-radius:16px}h1{font-size:36px;line-height:1.2}h2{margin-top:34px;font-size:24px}a{color:#2455a4}table{border-collapse:collapse;width:100%;font-size:15px}td,th{padding:12px;text-align:left;border-bottom:1px solid #dde4eb}th{background:#243b53;color:white}code{background:#eef2f6;padding:3px}img{width:100%;height:auto}li{margin-bottom:8px}.notice{background:#fff3d6;padding:16px}textarea,input,select{font:inherit;padding:10px;width:95%;margin:5px 0 16px}button{padding:12px 24px;background:#243b53;color:white;border:0;border-radius:5px;cursor:pointer}label{display:block;font-weight:bold}@media print{body{background:white}main{margin:0;padding:0}.noprint{display:none}h2{break-after:avoid}tr,img{break-inside:avoid}}</style><main><h1>Richiesta di sistemazione CSV</h1><p>Modulo locale per preparare la richiesta. Non invia dati a nessun server. Non costituisce un ordine o un pagamento.</p><label>Numero di righe</label><input id="righe" type="number" min="1" max="2000"><label>Numero di colonne</label><input id="colonne" type="number" min="1" max="12"><label>Intestazioni del CSV</label><textarea id="intestazioni" rows="3"></textarea><label>Formato date e separatore decimale</label><input id="formati" placeholder="Esempio: gg/mm/aaaa, virgola"><label>Risultato desiderato</label><textarea id="risultato" rows="4"></textarea><label>Duplicati</label><select id="duplicati"><option>Segnalare senza rimuovere</option><option>Valutare insieme la rimozione di righe identiche</option></select><p>Non inserire credenziali, nominativi dei clienti o dati sensibili. Valuta prevista: EUR. Prezzo totale e condizioni saranno confermati separatamente.</p><button id="download">Scarica richiesta .txt</button><script>document.getElementById('download').onclick=()=>{const ids=['righe','colonne','intestazioni','formati','risultato','duplicati'];const text=ids.map(id=>id+': '+document.getElementById(id).value).join('
');const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Richiesta_CSV.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};</script></main></html>
